<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IoT Double Door Cycle (Sequential Timer)</title>

<style>
body{
  margin:0;
  background:#0f172a;
  font-family:Arial;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  width:850px;
  background:#1e293b;
  padding:20px;
  border-radius:12px;
}

/* DOOR */
.door-frame{
  width:260px;
  height:200px;
  margin:auto;
  background:#020617;
  border:4px solid #94a3b8;
  display:flex;
  overflow:hidden;
}

.door{
  width:50%;
  height:100%;
  background:#64748b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  transition:transform 0.8s;
}

.left{transform-origin:left;}
.right{transform-origin:right;}

.open .left{transform:rotateY(-65deg); background:#22c55e;}
.open .right{transform:rotateY(65deg); background:#22c55e;}

/* STATUS */
.status{
  margin:10px auto;
  padding:8px;
  width:350px;
  text-align:center;
  background:#020617;
  border-radius:6px;
}

/* TIMERS */
.timers{
  display:flex;
  justify-content:space-around;
  margin:15px 0;
}
.timer{
  background:#020617;
  padding:8px;
  border-radius:6px;
  width:160px;
  text-align:center;
}

/* BUTTONS */
.controls{text-align:center;}
button{
  padding:10px 18px;
  margin:5px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}
.open-btn{background:#22c55e;}
.close-btn{background:#ef4444;}

/* TABLE */
table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
}
th,td{
  border:1px solid #475569;
  padding:8px;
  text-align:center;
}
th{background:#334155;}
</style>
</head>

<body>

<div class="container">
<h2 style="text-align:center">IoT Door </h2>

<div id="frame" class="door-frame">
  <div class="door left">LEFT</div>
  <div class="door right">RIGHT</div>
</div>

<div id="status" class="status">Status: Waiting</div>

<div class="timers">
  <div class="timer">Open: <span id="openT">0</span>s</div>
  <div class="timer">Load: <span id="loadT">0</span>s</div>
  <div class="timer">Close: <span id="closeT">0</span>s</div>
  <div class="timer">Unload: <span id="unloadT">0</span>s</div>
</div>

<div class="controls">
  <button class="open-btn" onclick="openDoor()">OPEN</button>
  <button class="close-btn" onclick="closeDoor()">CLOSE</button>
</div>

<table>
<thead>
<tr>
  <th>Cycle</th>
  <th>Open(s)</th>
  <th>Load(s)</th>
  <th>Close(s)</th>
  <th>Unload(s)</th>
</tr>
</thead>
<tbody id="log"></tbody>
</table>

</div>

<script>
let step = 0; // 0=load, 1=process done wait, 2=unload
let doorOpen = false;
let cycle = 0;

let timer = null;
let openSec=0, loadSec=0, closeSec=0, unloadSec=0;

const frame = document.getElementById("frame");
const statusBox = document.getElementById("status");
const openT = document.getElementById("openT");
const loadT = document.getElementById("loadT");
const closeT = document.getElementById("closeT");
const unloadT = document.getElementById("unloadT");
const log = document.getElementById("log");

function startTimer(type){
  stopTimer();
  timer = setInterval(()=>{
    if(type==="open"){ openT.innerText = ++openSec; }
    if(type==="load"){ loadT.innerText = ++loadSec; }
    if(type==="close"){ closeT.innerText = ++closeSec; }
    if(type==="unload"){ unloadT.innerText = ++unloadSec; }
  },1000);
}

function stopTimer(){
  clearInterval(timer);
}

function openDoor(){
  if(doorOpen) return;
  doorOpen=true;
  frame.classList.add("open");

  if(step===0){
    statusBox.innerText="Status: Door Open → Loading";
    startTimer("open");
    setTimeout(()=>startTimer("load"),1000);
  }
  else if(step===2){
    statusBox.innerText="Status: Door Open → Unloading";
    startTimer("unload");
  }
}

function closeDoor(){
  if(!doorOpen) return;
  doorOpen=false;
  frame.classList.remove("open");

  stopTimer();
  startTimer("close");

  setTimeout(()=>{
    stopTimer();

    if(step===0){
      statusBox.innerText="Status: Processing...";
      step=1;

      setTimeout(()=>{
        statusBox.innerText="Status: Process Done → Open Door";
        step=2;
      },2000);
    }
    else if(step===2){
      cycle++;
      log.innerHTML+=`
        <tr>
          <td>${cycle}</td>
          <td>${openSec}</td>
          <td>${loadSec}</td>
          <td>${closeSec}</td>
          <td>${unloadSec}</td>
        </tr>`;

      openSec=loadSec=closeSec=unloadSec=0;
      openT.innerText=loadT.innerText=closeT.innerText=unloadT.innerText=0;

      statusBox.innerText="Status: Cycle Completed ✔";
      step=0;
    }
  },1000);
}
</script>

</body>
</html>
