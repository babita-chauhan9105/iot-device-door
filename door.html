<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IoT Double Door Cycle System</title>

<style>
body{
  margin:0;
  background:#0f172a;
  font-family:Arial, sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  width:800px;
  background:#1e293b;
  padding:20px;
  border-radius:12px;
}

/* ================= DOOR ================= */
.door-frame{
  width:260px;
  height:200px;
  margin:auto;
  background:#020617;
  border:4px solid #94a3b8;
  display:flex;
  overflow:hidden;
}

.door{
  width:50%;
  height:100%;
  background:#64748b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  transition:transform 0.8s;
}

.left{ transform-origin:left; }
.right{ transform-origin:right; }

.open .left{ transform:rotateY(-65deg); background:#22c55e; }
.open .right{ transform:rotateY(65deg); background:#22c55e; }

/* ================= STATUS ================= */
.status{
  margin:15px auto;
  padding:8px;
  width:300px;
  text-align:center;
  background:#020617;
  border-radius:6px;
}

/* ================= BUTTONS ================= */
.controls{
  text-align:center;
}

button{
  padding:10px 18px;
  margin:5px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.open-btn{ background:#22c55e; }
.close-btn{ background:#ef4444; }

/* ================= TABLE ================= */
table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
}

th,td{
  border:1px solid #475569;
  padding:8px;
  text-align:center;
}

th{
  background:#334155;
}

.counter{
  margin-top:10px;
  text-align:center;
  font-size:18px;
}
</style>
</head>

<body>

<div class="container">
  <h2 style="text-align:center">IoT Double Door Cycle System</h2>

  <div id="frame" class="door-frame">
    <div class="door left">LEFT</div>
    <div class="door right">RIGHT</div>
  </div>

  <div id="status" class="status">Status: Waiting</div>

  <div class="controls">
    <button class="open-btn" onclick="openDoor()">OPEN</button>
    <button class="close-btn" onclick="closeDoor()">CLOSE</button>
  </div>

  <div class="counter">
    Cycle Count: <span id="cycle">0</span>
  </div>

  <!-- ================= TIME TABLE ================= -->
  <table>
    <thead>
      <tr>
        <th>Cycle</th>
        <th>Open Time (s)</th>
        <th>Loading Time (s)</th>
        <th>Closing Time (s)</th>
        <th>Unloading Time (s)</th>
      </tr>
    </thead>
    <tbody id="logTable"></tbody>
  </table>
</div>

<script>
let doorOpen=false;
let step=0; 
// 0=load, 1=process, 2=unload
let cycle=0;

let openStart, loadStart, closeStart, unloadStart;
let openTime, loadTime, closeTime, unloadTime;

const frame=document.getElementById("frame");
const statusBox=document.getElementById("status");
const cycleText=document.getElementById("cycle");
const table=document.getElementById("logTable");

function openDoor(){
  if(doorOpen) return;
  doorOpen=true;
  frame.classList.add("open");

  openStart=Date.now();

  if(step===0){
    statusBox.innerText="Status: Loading Material";
    loadStart=Date.now();
  }
  else if(step===2){
    statusBox.innerText="Status: Unloading Material";
    unloadStart=Date.now();
  }
}

function closeDoor(){
  if(!doorOpen) return;
  doorOpen=false;
  frame.classList.remove("open");

  closeStart=Date.now();

  if(step===0){
    openTime=((Date.now()-openStart)/1000).toFixed(1);
    loadTime=((Date.now()-loadStart)/1000).toFixed(1);

    statusBox.innerText="Status: Processing...";
    step=1;

    setTimeout(()=>{
      statusBox.innerText="Status: Process Done, Open Door";
      step=2;
    },2000);
  }
  else if(step===2){
    unloadTime=((Date.now()-unloadStart)/1000).toFixed(1);
    closeTime=((Date.now()-closeStart)/1000).toFixed(1);

    cycle++;
    cycleText.innerText=cycle;

    let row=`<tr>
      <td>${cycle}</td>
      <td>${openTime}</td>
      <td>${loadTime}</td>
      <td>${closeTime}</td>
      <td>${unloadTime}</td>
    </tr>`;
    table.innerHTML+=row;

    statusBox.innerText="Status: Cycle Completed ✔";
    step=0;
  }
}
</script>

</body>
</html>
